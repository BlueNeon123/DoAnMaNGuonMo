<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Bàn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center">
            <h1>Danh sách Bàn ăn</h1>
            <a th:href="@{/admin}" class="btn btn-secondary">Về Dashboard</a>
        </div>
        
        <a th:href="@{/tables/new}" class="btn btn-primary mb-3">Thêm mới Bàn</a>
        
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên Bàn</th>
                    <th>Trạng thái (Status)</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="table : ${tables}">
                    <td th:text="${table.id}"></td>
                    <td th:text="${table.name}"></td>
                    <td th:text="${table.status}"></td>
                    <td>
                        <a th:href="@{/tables/edit/{id}(id=${table.id})}" class="btn btn-success btn-sm">Sửa</a>
                        <a th:href="@{/tables/delete/{id}(id=${table.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
