<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form Danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <form th:action="@{/categories/save}" th:object="${category}" method="POST">

            <h1 th:if="*{id == null}">Thêm mới Danh mục</h1>
            <h1 th:if="*{id != null}">Cập nhật Danh mục</h1>

            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="name" class="form-label">Tên Danh mục:</label>
                <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Nhập tên danh mục">
            </div>

            <button type="submit" class="btn btn-primary">Lưu lại</button>
            <a th:href="@{/categories}" class="btn btn-secondary">Hủy</a>
        </form>
    </div>
</body>
</html>
