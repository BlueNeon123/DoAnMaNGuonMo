<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Thực đơn Quán Ăn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .card-dish {
            transition: transform 0.2s;
        }
        .card-dish:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="bg-light"> 

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Thực đơn Quán Ăn Bình Dân</a>

            <div class="d-flex">
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
    <span class="navbar-text text-light me-3">
        Chào, <strong sec:authentication="name">Tài khoản</strong>!
    </span>
    
    <!-- NÚT MỚI: Chỉ hiện lên nếu tài khoản đang đăng nhập có quyền ADMIN hoặc STAFF -->
    <a sec:authorize="hasAnyRole('ADMIN', 'STAFF')" th:href="@{/admin}" class="btn btn-warning fw-bold me-2">
        ⚙️ Về Dashboard
    </a>
    
    <!-- Đăng xuất của Admin -->
    <a sec:authorize="hasAnyRole('ADMIN', 'STAFF')" th:href="@{/logout}" class="btn btn-outline-light">Đăng xuất</a>
    
    <!-- Đăng xuất của Khách hàng -->
    <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/customer-logout}" class="btn btn-outline-danger">Đăng xuất</a>
</div>
                
                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/register}" class="btn btn-primary">Đăng ký (Khách)</a>
                    <a th:href="@{/customer-login}" class="btn btn-success ms-2">Đăng nhập (Khách)</a>
                </div>
            </div>
            
        </div>
    </nav>

    <div class="container mt-4">
        
        <div class="row justify-content-center mb-5">
            <div class="col-md-8">
                <form th:action="@{/}" method="get" class="d-flex shadow-sm p-3 bg-white rounded">
                    <input class="form-control me-2 border-0 bg-light" type="search" name="keyword" 
                           th:value="${keyword}" placeholder="Bạn muốn ăn gì hôm nay? (Ví dụ: Cơm, Phở...)" aria-label="Search">
                    <button class="btn btn-primary px-4 fw-bold" type="submit">Tìm</button>
                    
                    <a th:if="${keyword != null && keyword != ''}" th:href="@{/}" class="btn btn-outline-secondary ms-2">Xóa</a>
                </form>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(dishes)}" class="text-center text-muted my-5">
            <h3>Không tìm thấy món ăn nào phù hợp 😢</h3>
            <a th:href="@{/}" class="btn btn-outline-primary mt-3">Xem tất cả thực đơn</a>
        </div>

        <div th:if="${not #lists.isEmpty(dishes)}">
            <div th:each="category : ${categories}" class="mb-5">
                
                <h2 class="display-5 fw-bold text-center mt-5 mb-4" th:text="${category.name}">Tên Danh mục</h2>
                
                <div class="row">
                    <div th:each="dish : ${dishes}" th:if="${dish.category.id == category.id}" class="col-md-6 col-lg-4"> <div class="card shadow-sm border-0 mb-4 card-dish h-100">
                            
                            <img th:if="${dish.imageUrl != null}" 
                                 th:src="@{'/dish-images/' + ${dish.imageUrl}}" 
                                 class="card-img-top" 
                                 style="height: 200px; object-fit: cover;" 
                                 alt="Hình ảnh món ăn">
                                 
                            <img th:unless="${dish.imageUrl != null}"
                                 src="https://via.placeholder.com/300x200?text=No+Image" 
                                 class="card-img-top"
                                 style="height: 200px; object-fit: cover;">
                
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h5 class="card-title fw-bold mb-0" th:text="${dish.name}">Tên Món ăn</h5>
                                    
                                    <span class="badge bg-danger rounded-pill fs-6" 
                                          th:text="${#numbers.formatDecimal(dish.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                        Giá
                                    </span>
                                </div>
                            </div>
                        </div>
                        </div>
                </div>
                
            </div> 
        </div>

    </div>
</body>
</html>
