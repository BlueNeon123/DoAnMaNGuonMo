<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký Tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .register-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2 class="text-center mb-4">Tạo Tài khoản Khách hàng</h2>

        <div th:if="${registrationSuccess}" class="alert alert-success text-center">
            <h4>Đăng ký thành công!</h4>
            <p>Bạn bây giờ có thể đăng nhập (khi chúng ta xây dựng chức năng đó).</p>
            <a th:href="@{/}" class="btn btn-primary mt-2">Quay về Trang chủ</a>
        </div>

        <form th:unless="${registrationSuccess}" 
              th:action="@{/register}" 
              th:object="${customer}" 
              method="POST">
            
            <div class="mb-3">
                <label for="username" class="form-label">Tên đăng nhập:</label>
                <input type="text" th:field="*{username}" class="form-control" id="username" required>
                <div class="text-danger" 
                     th:if="${#fields.hasErrors('username')}" 
                     th:errors="*{username}">
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu:</label>
                <input type="password" th:field="*{password}" class="form-control" id="password" required>
            </div>
            
            <div class="mb-3">
                <label for="fullName" class="form-label">Tên đầy đủ:</label>
                <input type="text" th:field="*{fullName}" class="form-control" id="fullName">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" th:field="*{email}" class="form-control" id="email">
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Số điện thoại:</label>
                <input type="text" th:field="*{phone}" class="form-control" id="phone">
            </div>
            
            <button type="submit" class="btn btn-primary w-100">Đăng ký</button>

            <div class="text-center mt-3">
                <a th:href="@{/}" class="text-muted">Quay về trang chủ</a>
            </div>
        </form>
    </div>
</body>
</html>
