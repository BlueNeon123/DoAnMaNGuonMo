<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lịch sử Đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🧾 Lịch sử Đơn hàng của bạn</h2>
        <a th:href="@{/}" class="btn btn-secondary">&laquo; Trở về Trang chủ</a>
    </div>

    <div th:if="${orders == null or orders.isEmpty()}" class="alert alert-info text-center">
        Bạn chưa có đơn hàng nào. <a th:href="@{/}" class="alert-link">Đặt món ngay!</a>
    </div>

    <div th:if="${orders != null and !orders.isEmpty()}">
        <div class="card shadow-sm mb-4" th:each="order : ${orders}">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <span class="fw-bold" th:text="'Mã đơn: #ORD' + ${order.id}">#ORD1</span>
                
                <span th:if="${order.status == 'ONLINE_PENDING'}" class="badge bg-warning text-dark fs-6">Chờ xác nhận</span>
                <span th:if="${order.status == 'SHIPPING'}" class="badge bg-primary fs-6">Đang giao hàng</span>
                <span th:if="${order.status == 'COMPLETED'}" class="badge bg-success fs-6">Đã hoàn thành</span>
                <span th:if="${order.status == 'CANCELED'}" class="badge bg-danger fs-6">Đã hủy</span>
            </div>
            
            <div class="card-body">
                <div class="row">
                    <div class="col-md-8">
                        <h6 class="text-muted mb-3">Chi tiết món ăn:</h6>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="detail : ${order.orderDetails}">
                                <span>
                                    <span class="fw-bold text-primary" th:text="${detail.quantity} + 'x '">2x</span>
                                    <span th:text="${detail.dish.name}">Cơm sườn</span>
                                </span>
                                <span class="text-muted" th:text="${#numbers.formatDecimal(detail.priceAtOrder, 0, 'COMMA', 0, 'POINT')} + ' đ'">30,000 đ</span>
                            </li>
                        </ul>
                    </div>
                    <div class="col-md-4 border-start d-flex flex-column justify-content-center align-items-end">
                        <p class="mb-1 text-muted">Tổng cộng:</p>
                        <h4 class="text-danger fw-bold mb-3" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">60,000 đ</h4>
                        <p class="mb-0 small text-muted" th:text="'Giao đến: ' + ${order.shippingAddress}">Địa chỉ...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
