<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử Đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"> </head>
<body>

    <nav class="navbar navbar-expand-lg shadow-sm">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">🍜 Quán Ăn Bình Dân</a>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/}" class="btn-nav-ghost">← Về trang chủ</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <h2 class="title-custom mb-4">🧾 Lịch sử mua hàng</h2>

        <div th:if="${orders == null or orders.isEmpty()}" class="card-custom p-5 text-center">
            <h4 class="title-custom text-muted mb-3">Bạn chưa có đơn hàng nào</h4>
            <a th:href="@{/}" class="btn-outline-custom">Đặt món ngay!</a>
        </div>

        <div th:if="${orders != null and !orders.isEmpty()}" class="row g-4">
            <div class="col-12" th:each="order : ${orders}">
                <div class="card-custom">
                    <div class="card-header-custom p-3 d-flex justify-content-between align-items-center">
                        <span class="fs-5" th:text="'Mã đơn: #ORD' + ${order.id}">#ORD1</span>
                        
                        <span th:if="${order.status == 'ONLINE_PENDING'}" class="badge bg-warning text-dark px-3 py-2">Chờ xác nhận</span>
                        <span th:if="${order.status == 'SHIPPING'}" class="badge bg-info text-dark px-3 py-2">Đang giao hàng</span>
                        <span th:if="${order.status == 'COMPLETED'}" class="badge bg-success px-3 py-2">Hoàn thành</span>
                        <span th:if="${order.status == 'CANCELED'}" class="badge bg-danger px-3 py-2">Đã hủy</span>
                    </div>
                    
                    <div class="card-body p-4 row">
                        <div class="col-md-8">
                            <ul class="list-unstyled mb-0">
                                <li class="d-flex justify-content-between mb-2 border-bottom pb-2 border-light" th:each="detail : ${order.orderDetails}">
                                    <span>
                                        <strong class="text-terracotta me-2" th:text="${detail.quantity} + 'x'">2x</strong>
                                        <span th:text="${detail.dish.name}">Cơm sườn</span>
                                    </span>
                                    <span class="text-muted" th:text="${#numbers.formatDecimal(detail.priceAtOrder, 0, 'COMMA', 0, 'POINT')} + ' đ'">30k</span>
                                </li>
                            </ul>
                        </div>
                        <div class="col-md-4 border-start ps-4 d-flex flex-column justify-content-center">
                            <p class="mb-1 text-muted small fw-bold">TỔNG CỘNG</p>
                            <h3 class="text-terracotta fw-bold mb-3" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">60k</h3>
                            <p class="mb-0 small text-muted"><strong>Giao đến:</strong> <span th:text="${order.shippingAddress}">Địa chỉ</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
