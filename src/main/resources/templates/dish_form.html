<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Form Món ăn</title>
</head>
<body>

    <main layout:fragment="content">
        <div class="container mt-4" style="max-width: 600px;">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0" th:if="*{id == null}">Thêm mới Món ăn</h3>
                    <h3 class="mb-0" th:if="*{id != null}">Cập nhật Món ăn</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/dishes/save}" th:object="${dish}" method="POST" enctype="multipart/form-data">
                        
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="mb-3">
                            <label class="form-label">Danh mục:</label>
                            <select th:field="*{category}" class="form-select">
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Tên Món ăn:</label>
                            <input type="text" th:field="*{name}" class="form-control" required>
                        </div>
            
                        <div class="mb-3">
                            <label class="form-label">Giá tiền:</label>
                            <input type="number" th:field="*{price}" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Hình ảnh:</label>
                            <input type="file" name="imageFile" class="form-control" accept="image/png, image/jpeg" />
                        </div>
                        
                        <button type="submit" class="btn btn-success">Lưu lại</button>
                        <a th:href="@{/dishes}" class="btn btn-secondary">Hủy</a>
                    </form>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
