<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Đơn hàng Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📦 Quản lý Đơn hàng Online</h2>
        <a th:href="@{/admin}" class="btn btn-secondary">Về Dashboard</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Mã Đơn</th>
                        <th>Khách hàng</th>
                        <th>Điện thoại</th>
                        <th>Địa chỉ giao</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td class="fw-bold" th:text="'#ORD' + ${order.id}">#ORD1</td>
                        <td th:text="${order.customer.fullName}">Tên khách</td>
                        <td th:text="${order.customerPhone}">0123...</td>
                        <td th:text="${order.shippingAddress}">Ký túc xá...</td>
                        <td class="text-danger fw-bold" 
                            th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">100,000 đ</td>
                        
                        <td>
                            <span th:if="${order.status == 'ONLINE_PENDING'}" class="badge bg-warning text-dark">Chờ xác nhận</span>
                            <span th:if="${order.status == 'SHIPPING'}" class="badge bg-primary">Đang giao hàng</span>
                            <span th:if="${order.status == 'COMPLETED'}" class="badge bg-success">Đã hoàn thành</span>
                            <span th:if="${order.status == 'CANCELED'}" class="badge bg-danger">Đã hủy</span>
                        </td>

                        <td>
                            <form th:if="${order.status == 'ONLINE_PENDING'}" th:action="@{/admin/orders/update-status}" method="post" class="d-inline">
                                <input type="hidden" name="id" th:value="${order.id}">
                                <input type="hidden" name="status" value="SHIPPING">
                                <button type="submit" class="btn btn-sm btn-primary">Giao hàng</button>
                            </form>

                            <form th:if="${order.status == 'SHIPPING'}" th:action="@{/admin/orders/update-status}" method="post" class="d-inline">
                                <input type="hidden" name="id" th:value="${order.id}">
                                <input type="hidden" name="status" value="COMPLETED">
                                <button type="submit" class="btn btn-sm btn-success">Hoàn thành</button>
                            </form>

                            <form th:if="${order.status == 'ONLINE_PENDING'}" th:action="@{/admin/orders/update-status}" method="post" class="d-inline">
                                <input type="hidden" name="id" th:value="${order.id}">
                                <input type="hidden" name="status" value="CANCELED">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Bạn có chắc muốn hủy đơn này?');">Hủy</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
