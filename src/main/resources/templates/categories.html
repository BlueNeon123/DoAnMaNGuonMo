<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
        <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Danh sách Danh mục</h1>
        <a th:href="@{/admin}" class="btn btn-secondary">Về Dashboard</a>
    </div>

    <a th:href="@{/categories/new}" class="btn btn-primary mb-3">Thêm mới Danh mục</a>

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên Danh mục</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cat : ${categories}">
                    <td th:text="${cat.id}"></td>
                    <td th:text="${cat.name}"></td>
                    <td>
                        <a th:href="@{/categories/edit/{id}(id=${cat.id})}" class="btn btn-success btn-sm">Sửa</a>
                        <a th:href="@{/categories/delete/{id}(id=${cat.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
