<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"> 
<head>
    <meta charset="UTF-8">
    <title>Quản lý Quán ăn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            overflow-x: hidden;
        }
        #wrapper {
            display: flex;
        }
        #sidebar-wrapper {
            width: 250px; /* Cố định chiều rộng sidebar */
            min-height: 100vh;
        }
        
        /* * ĐÂY LÀ CHỖ SỬA QUAN TRỌNG:
         * Xóa "min-width: 100vw"
         * Thêm "flex-grow: 1" để nó tự động chiếm phần còn lại
         */
        #page-content-wrapper {
            flex-grow: 1;
            width: 100%;
            min-width: 0; /* Fix cho flexbox overflow */
        }
        
        /* CSS cũ (vẫn giữ) */
        .list-group-item-action:hover, .list-group-item-action:focus {
            background-color: #e9ecef;
        }
        .sidebar-heading {
            padding: 0.875rem 1.25rem;
            font-size: 1.2rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="d-flex" id="wrapper">

        <div th:replace="~{fragments/_sidebar :: sidebar}"></div>

        <div id="page-content-wrapper">
            
            <div th:replace="~{fragments/_header :: header}"></div>

            <div class="container-fluid px-4 pt-4"> <main layout:fragment="content">
                    </main>
            </div>
        </div>
        
    </div> </body>
</html>
