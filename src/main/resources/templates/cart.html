<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Giỏ hàng của bạn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">🛒 Giỏ hàng của bạn</h2>
    
    <div th:if="${cart == null or cart.isEmpty()}" class="alert alert-info">
        Giỏ hàng đang trống. <a th:href="@{/}">Quay lại mua sắm</a>
    </div>

    <div class="row" th:if="${cart != null and !cart.isEmpty()}">
        <<div class="col-md-8">
            <table class="table table-bordered bg-white text-center align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Tên món</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cart}">
                        <td class="fw-bold text-start" th:text="${item.name}">Cơm sườn</td>
                        <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">30,000 đ</td>
                        
                        <td>
                            <div class="d-flex justify-content-center align-items-center">
                                <a th:href="@{'/cart/update/' + ${item.dishId} + '?action=decrease'}" class="btn btn-sm btn-outline-secondary px-2 fw-bold">-</a>
                                <span class="mx-3 fw-bold" th:text="${item.quantity}">2</span>
                                <a th:href="@{'/cart/update/' + ${item.dishId} + '?action=increase'}" class="btn btn-sm btn-outline-secondary px-2 fw-bold">+</a>
                            </div>
                        </td>
                        
                        <td class="text-danger fw-bold" 
                            th:text="${#numbers.formatDecimal(item.subTotal, 0, 'COMMA', 0, 'POINT')} + ' đ'">60,000 đ</td>
                            
                        <td>
                            <a th:href="@{'/cart/remove/' + ${item.dishId}}" class="btn btn-sm btn-danger" onclick="return confirm('Bạn không muốn ăn món này nữa?');">🗑️</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div class="d-flex justify-content-between mt-3">
                <a th:href="@{/}" class="btn btn-secondary">&laquo; Chọn thêm món khác</a>
                <a th:href="@{/cart/clear}" class="btn btn-outline-danger" onclick="return confirm('Xóa sạch giỏ hàng hiện tại?');">
                    🗑️ Hủy giỏ hàng
                </a>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Tổng cộng: 
                        <span class="text-danger" th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                    </h5>
                    <hr>
                    <form th:action="@{/cart/checkout}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Địa chỉ giao hàng (*)</label>
                            <input type="text" name="address" class="form-control" required placeholder="VD: KTX Khu A...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại người nhận (*)</label>
                            <input type="text" name="phone" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Xác nhận Đặt Hàng</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
