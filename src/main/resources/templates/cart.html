<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng của bạn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"> </head>
<body>

    <nav class="navbar navbar-expand-lg shadow-sm">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">🍜 Quán Ăn Bình Dân</a>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/}" class="btn-nav-ghost">← Về thực đơn</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <h2 class="title-custom mb-4">🛒 Giỏ hàng của bạn</h2>
        
        <div th:if="${cart == null or cart.isEmpty()}" class="card-custom p-5 text-center">
            <h4 class="title-custom text-muted mb-3">Giỏ hàng đang trống</h4>
            <a th:href="@{/}" class="btn-outline-custom">Tiếp tục mua sắm</a>
        </div>

        <div class="row g-4" th:if="${cart != null and !cart.isEmpty()}">
            <div class="col-md-8">
                <table class="table table-custom text-center align-middle w-100">
                    <thead>
                        <tr>
                            <th class="text-start">Tên món</th>
                            <th>Đơn giá</th>
                            <th>Số lượng</th>
                            <th>Thành tiền</th>
                            <th>Xóa</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${cart}">
                            <td class="fw-bold text-start" th:text="${item.name}">Cơm sườn</td>
                            <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">30,000 đ</td>
                            <td>
                                <div class="d-flex justify-content-center align-items-center gap-2">
                                    <a th:href="@{'/cart/update/' + ${item.dishId} + '?action=decrease'}" class="btn btn-sm btn-outline-secondary px-2">-</a>
                                    <span class="fw-bold" th:text="${item.quantity}">2</span>
                                    <a th:href="@{'/cart/update/' + ${item.dishId} + '?action=increase'}" class="btn btn-sm btn-outline-secondary px-2">+</a>
                                </div>
                            </td>
                            <td class="text-terracotta fw-bold" th:text="${#numbers.formatDecimal(item.subTotal, 0, 'COMMA', 0, 'POINT')} + ' đ'">60,000 đ</td>
                            <td>
                                <a th:href="@{'/cart/remove/' + ${item.dishId}}" class="text-danger fs-5 text-decoration-none" onclick="return confirm('Bỏ món này?');">🗑️</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/}" class="btn-outline-custom">&laquo; Chọn thêm món</a>
                    <a th:href="@{/cart/clear}" class="btn-nav-danger" onclick="return confirm('Xóa sạch giỏ hàng?');">Hủy giỏ hàng</a>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card-custom">
                    <div class="card-header-custom p-3">
                        <h5 class="mb-0">Tổng thanh toán</h5>
                    </div>
                    <div class="card-body p-4">
                        <h3 class="text-terracotta fw-bold text-end mb-4" th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</h3>
                        <form th:action="@{/cart/checkout}" method="post">
                            <div class="mb-3">
                                <label class="form-label text-muted fw-bold small">Địa chỉ giao hàng (*)</label>
                                <input type="text" name="address" class="form-control bg-light border-0" required placeholder="Nhập địa chỉ...">
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-muted fw-bold small">Số điện thoại (*)</label>
                                <input type="text" name="phone" class="form-control bg-light border-0" required placeholder="Nhập SĐT...">
                            </div>
                            <button type="submit" class="btn-add w-100 py-2 fs-6">Xác nhận Đặt Hàng</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
