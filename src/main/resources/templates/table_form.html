<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form Bàn ăn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <form th:action="@{/tables/save}" th:object="${table}" method="POST">
            
            <h1 th:if="*{id == null}">Thêm mới Bàn</h1>
            <h1 th:if="*{id != null}">Cập nhật Bàn</h1>
            
            <input type="hidden" th:field="*{id}" />
            
            <input type="hidden" th:field="*{status}" />
            
            <div class="mb-3">
                <label for="name" class="form-label">Tên Bàn:</label>
                <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Ví dụ: Bàn 5, Bàn VIP 1...">
            </div>
            
            <button type="submit" class="btn btn-primary">Lưu lại</button>
            <a th:href="@{/tables}" class="btn btn-secondary">Hủy</a>
        </form>
    </div>
</body>
</html>
