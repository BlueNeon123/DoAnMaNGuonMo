<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sơ đồ Bàn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* CSS để làm cho cái card bàn giống cái nút bấm */
        .table-card {
            border: 2px solid #ddd;
            border-radius: 10px;
            text-decoration: none;
            color: black;
            transition: transform 0.2s;
            display: block; /* Làm cho cả card là link */
            margin-bottom: 20px;
        }
        .table-card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .table-card-body {
            padding: 1.5rem;
        }
        /* Màu cho bàn có khách (OCCUPIED) */
        .table-card.occupied {
            background-color: #ffe8e8; /* Màu đỏ nhạt */
            border-color: #dc3545;
        }
        /* Màu cho bàn trống (EMPTY) */
        .table-card.empty {
            background-color: #e8fff1; /* Màu xanh nhạt */
            border-color: #198754;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Sơ đồ Bàn</h1>
            <a th:href="@{/admin}" class="btn btn-secondary">Về Dashboard</a>
        </div>

        <div class="row">
            <div class="col-md-3" th:each="table : ${tables}">
                
                <a th:href="@{/sales/table/{id}(id=${table.id})}" 
                   class="table-card"
                   th:classappend="${table.status == 'OCCUPIED' ? 'occupied' : 'empty'}">
                    
                    <div class="table-card-body text-center">
                        <h5 class="card-title" th:text="${table.name}">Bàn 1</h5>
                        <p class="card-text fw-bold" 
                           th:text="${table.status == 'OCCUPIED' ? 'Đang có khách' : 'Còn trống'}"
                           th:classappend="${table.status == 'OCCUPIED' ? 'text-danger' : 'text-success'}">
                           Trạng thái
                        </p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
