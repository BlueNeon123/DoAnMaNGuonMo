<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form Người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <form th:action="@{/users/save}" th:object="${user}" method="POST">
            
            <h1 th:if="*{id == null}">Thêm mới Người dùng</h1>
            <h1 th:if="*{id != null}">Cập nhật Người dùng</h1>
            
            <input type="hidden" th:field="*{id}" />
            
            <div class="mb-3">
                <label for="username" class="form-label">Tên đăng nhập (Username):</label>
                <input type="text" th:field="*{username}" class="form-control" id="username">
            </div>

            <div class="mb-3">
                <label for="fullName" class="form-label">Tên đầy đủ:</label>
                <input type="text" th:field="*{fullName}" class="form-control" id="fullName">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu:</label>
                <input type="password" th:field="*{password}" class="form-control" id="password" 
                       th:placeholder="*{id != null} ? 'Để trống nếu không muốn đổi' : 'Nhập mật khẩu'">
            </div>

            <div class="mb-3">
                <label for="role" class="form-label">Vai trò (Role):</label>
                <select th:field="*{role}" class="form-select" id="role">
                    <option value="">-- Chọn vai trò --</option>
                    <option value="STAFF">Nhân viên (STAFF)</option>
                    <option value="ADMIN">Quản lý (ADMIN)</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Lưu lại</button>
            <a th:href="@{/users}" class="btn btn-secondary">Hủy</a>
        </form>
    </div>
</body>
</html>
