<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="'Chi tiết Order - ' + ${table.name}">Chi tiết Order</h1>
            <a th:href="@{/sales}" class="btn btn-secondary">Quay lại Sơ đồ bàn</a>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Thêm Món</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/sales/order/addDish}" method="POST">
                            <input type="hidden" name="orderId" th:value="${order.id}" />
                            
                            <div class="mb-3">
                                <label for="dish" class="form-label">Chọn món:</label>
                                <select name="dishId" class="form-select" id="dish">
                                    <option value="">-- Chọn Món ăn --</option>
                                    <option th:each="dish : ${menu}"
                                            th:value="${dish.id}"
                                            th:text="${dish.name} + ' (' + ${#numbers.formatDecimal(dish.price, 0, 'COMMA', 0, 'POINT')} + ' đ)'">
                                    </option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="quantity" class="form-label">Số lượng:</label>
                                <input type="number" name="quantity" class="form-control" id="quantity" value="1" min="1">
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">Thêm vào Order</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5>Các món đã gọi</h5>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Tên Món</th>
                                    <th>Số lượng</th>
                                    <th>Đơn giá</th>
                                    <th>Thành tiền</th>
                                    <th>Xóa</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="detail : ${order.orderDetails}">
                                    <td th:text="${detail.dish.name}"></td>
                                    <td th:text="${detail.quantity}"></td>
                                    <td th:text="${#numbers.formatDecimal(detail.priceAtOrder, 0, 'COMMA', 0, 'POINT')}"></td>
                                    <td th:text="${#numbers.formatDecimal(detail.priceAtOrder * detail.quantity, 0, 'COMMA', 0, 'POINT')}"></td>
                                    <td>
                                        <a th:href="@{/sales/order/removeDish/{id}(id=${detail.id})}" 
                                           class="btn btn-danger btn-sm"
                                           onclick="return confirm('Bạn có chắc muốn xóa món này?')">X</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        
                        <hr>
                        
                        <div class="text-end">
                            <h4>Tổng tiền: 
                                <span class="text-danger fw-bold" 
                                      th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                0 đ
                                </span>
                            </h4>
                            
                            <form th:action="@{/sales/order/pay}" method="POST" class="mt-3">
                                <input type="hidden" name="orderId" th:value="${order.id}" />
                                <button type="submit" class="btn btn-success btn-lg" 
                                        onclick="return confirm('Xác nhận thanh toán hóa đơn này?')">
                                    Thanh Toán
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
